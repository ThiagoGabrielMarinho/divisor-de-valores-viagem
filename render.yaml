# Render Blueprint — Trip Splitter
# Sobe a API + frontend no mesmo serviço, usando um PostgreSQL EXTERNO (Aiven).
# No Render: New > Blueprint, aponte para este repositório. O DATABASE_URL
# NÃO fica no repositório: você o preenche no painel do Render (sync: false)
# com a connection string do seu banco Aiven.

services:
  - type: web
    name: trip-splitter
    runtime: node
    plan: free
    # O código do projeto está na subpasta trip-splitter/backend.
    rootDir: trip-splitter/backend
    # --include=dev garante que typescript/ts-node (devDependencies) sejam
    # instalados mesmo com NODE_ENV=production, senão o build tsc falha.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Preencha no painel do Render com a connection string do Aiven.
      # sync: false mantém o segredo fora do repositório.
      - key: DATABASE_URL
        sync: false
